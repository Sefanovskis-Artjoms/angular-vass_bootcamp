<mat-card class="todo-edit__card">
  <form
    class="todo-edit__form"
    [formGroup]="editTodoForm"
    (ngSubmit)="onSubmit()"
  >
    <mat-card-header>
      <div class="todo-edit__header">
        <span class="mat-headline-5">Edit todo</span>
        <a matButton="outlined" [routerLink]="['/todo-list']">
          <mat-icon>arrow_back</mat-icon>
          Back
        </a>
      </div>
    </mat-card-header>
    <mat-card-content>
      <mat-form-field class="full-width">
        <mat-label>Title</mat-label>
        <input
          matInput
          type="text"
          value="{{todo.title}}"
          formControlName="title"
        />
        <mat-error *ngIf="title?.invalid && (title?.dirty || title?.touched)">
          <span *ngIf="title?.errors?.['required']">Title is required.</span>
          <span *ngIf="title?.errors?.['minlength']">
            Title must be at least 3 characters.
          </span>
        </mat-error>
      </mat-form-field>

      <div class="todo-edit__select-group">
        <mat-form-field>
          <mat-label>Status</mat-label>
          <mat-select value="{{todo.status}}" formControlName="status">
            <mat-option value="Todo">Todo</mat-option>
            <mat-option value="In progress">In progress</mat-option>
            <mat-option value="Done">Done</mat-option>
          </mat-select>
          <mat-error
            *ngIf="status?.invalid && (status?.dirty || status?.touched)"
          >
            <span *ngIf="status?.errors?.['required']">
              Status is required.
            </span>
          </mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Type</mat-label>
          <mat-select value="{{todo.type}}" formControlName="type">
            <mat-option value="Feature">Feature</mat-option>
            <mat-option value="Bug">Bug</mat-option>
            <mat-option value="Story">Story</mat-option>
            <mat-option value="Other">Other</mat-option>
          </mat-select>
          <mat-error *ngIf="type?.invalid && (type?.dirty || type?.touched)">
            <span *ngIf="type?.errors?.['required']">Type is required.</span>
          </mat-error>
        </mat-form-field>
      </div>

      <mat-form-field class="full-width todo-edit__description">
        <mat-label>Description</mat-label>
        <textarea
          matInput
          value="{{todo.description}}"
          formControlName="description"
        ></textarea>
        <mat-error
          *ngIf="description?.invalid && (description?.dirty || description?.touched)"
        >
          <span *ngIf="description?.errors?.['required']">
            Description is required.
          </span>
          <span *ngIf="description?.errors?.['minlength']">
            Description must be at least 10 characters.
          </span>
        </mat-error>
      </mat-form-field>
    </mat-card-content>
    <mat-card-actions class="todo-edit__actions">
      <button
        matButton="outlined"
        type="submit"
        [disabled]="editTodoForm.invalid"
      >
        <mat-icon>check</mat-icon>Confirm
      </button>
      <a
        matButton="outlined"
        type="submit"
        [routerLink]="['/todo-details/'+ todo.id]"
      >
        <mat-icon>close</mat-icon>Cancel
      </a>
    </mat-card-actions>
  </form>
</mat-card>
