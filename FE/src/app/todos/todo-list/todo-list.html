<div class="todo__list-container">
  <a class="todo__add-btn" matButton="outlined" [routerLink]="['/todo-create']">
    <mat-icon>add</mat-icon>
    Add Todo
  </a>

  <ul *ngIf="todos$ | async as todos" class="todo__list">
    <ng-container *ngIf="todos.length > 0; else noTodosContent">
      <li *ngFor="let todo of todos" class="todo__list-item">
        <a [routerLink]="['/todo-details', todo.id]" class="todo__list-link">
          <span
            class="todo__todo-flag"
            [ngClass]="'todo__todo-flag--' + todo.status.toLowerCase().replace(' ','')"
            >{{todo.status}}</span
          >
          <span
            class="todo__todo-flag"
            [ngClass]="'todo__todo-flag--' + todo.type.toLowerCase()"
            >{{ todo.type }}</span
          >
          <span class="todo__list-item-title">{{ todo.title }}</span>
          <span class="todo__list-date"> {{ todo.createdOn | date }} </span>
        </a>
        <button
          class="btn todo__delete-btn"
          (click)="handleDelete(todo.id)"
          [disabled]="isDeletingIds.has(todo.id)"
          [ngClass]="{ 'todo__delete-btn--deleting': isDeletingIds.has(todo.id) }"
        >
          <mat-icon *ngIf="!isDeletingIds.has(todo.id)">delete</mat-icon>
          <mat-spinner
            *ngIf="isDeletingIds.has(todo.id)"
            [diameter]="15"
            mode="indeterminate"
          ></mat-spinner>
          {{ isDeletingIds.has(todo.id) ? 'Deleting' : 'Delete' }}
        </button>
      </li>
    </ng-container>
    <ng-template #noTodosContent>
      <div class="todo__not-found">Currently, there are no todos.</div>
    </ng-template>
  </ul>
</div>
